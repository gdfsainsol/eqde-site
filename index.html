<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EqDe Capital — a GDFS Group company</title>
<meta name="robots" content="noindex,nofollow">

<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#263054">

<meta property="og:type" content="website">
<meta property="og:site_name" content="EqDe Capital">
<meta property="og:title" content="EqDe Capital">
<meta property="og:description" content="We calculate. We don't predict. A GDFS Group company.">
<meta property="og:image" content="assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  /* pulled straight from the GDFS mark */
  --navy:#263054;         /* wordmark */
  --violet:#8A4794;       /* swoosh start */
  --blue:#4E6FB2;
  --cyan:#0B9DD0;
  --teal:#11B092;
  --green:#16B774;        /* swoosh end */
  --gold:#F2B705;         /* accent */
  --paper:#FFFFFF;
  --wash:#EEF4FB;
  --mu:#5E6E8C;
  --edge:#D8E3F0;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --disp:"Archivo",system-ui,sans-serif;--serif:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#05080F;color:#EAF1FA;font:400 16px/1.6 var(--sans);overflow:hidden}
body.done{overflow-y:auto;background:var(--wash);color:var(--navy)}

/* ================= the film ================= */
/* The film carries its own era chips and title bars at the very top and bottom
   of the frame, so it must never be cropped. The stage is locked to 16:9 and
   letterboxed into brand navy. */
.reel{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(157deg,#0A1024 0%,#161F42 52%,#0A1024 100%)}
.frame{position:relative;width:100%;aspect-ratio:16/9;
  max-height:100dvh;max-width:calc(100dvh * 16 / 9)}
video{width:100%;height:100%;object-fit:contain;display:block;
  transition:filter 1.5s ease,transform 1.5s ease,opacity 1.5s ease}
body.done video{filter:brightness(.5) saturate(.35) blur(7px);transform:scale(1.08);opacity:.16}
.wash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s ease;
  background:linear-gradient(165deg,#FFFFFF 0%,var(--wash) 46%,#E2EDF9 100%)}
body.done .wash{opacity:.93}

/* the GDFS watermark and brand card are burned into the film itself */

/* sound — browsers refuse to autoplay audio, so the film starts muted and
   the visitor turns sound on. Sits opposite the watermark. */
.snd{position:absolute;right:2.4%;bottom:8.5%;z-index:9;cursor:pointer;
  display:flex;align-items:center;gap:8px;padding:9px 15px 9px 13px;
  border:1px solid rgba(255,255,255,.34);border-radius:999px;
  background:rgba(8,16,32,.56);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);color:#EAF1FA;
  font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  transition:opacity .9s ease,background .2s}
.snd:hover{background:rgba(8,16,32,.78)}
.snd svg{width:15px;height:15px;flex:none;fill:currentColor}
.snd .wave{opacity:0;transition:opacity .2s}
.snd.live .wave{opacity:1}
.snd.live{border-color:rgba(22,183,116,.65)}
body.done .snd{opacity:0;pointer-events:none}

/* ================= login ================= */
.gate{position:relative;z-index:10;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:46px 22px 34px;
  opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 1.1s}
.gate.on{opacity:1;visibility:visible}

.logo-row{display:flex;align-items:center;gap:clamp(11px,1.7vw,18px)}
.mark{width:clamp(40px,5vw,58px);flex:none}
.m-top{fill:var(--navy)}
.m-seg{opacity:0}
.gate.on .m-seg{animation:seg .5s cubic-bezier(.2,.9,.3,1) forwards}
.gate.on .m-seg:nth-of-type(2){animation-delay:.42s}
.gate.on .m-seg:nth-of-type(3){animation-delay:.52s}
.gate.on .m-seg:nth-of-type(4){animation-delay:.62s}
.gate.on .m-seg:nth-of-type(5){animation-delay:.72s}
.gate.on .m-seg:nth-of-type(6){animation-delay:.82s}
@keyframes seg{from{opacity:0;transform:translateX(17px)}to{opacity:1;transform:none}}
.word{font:800 clamp(38px,7vw,80px)/.9 var(--disp);letter-spacing:-.045em;
  white-space:nowrap;color:var(--navy)}
.word .d{background:linear-gradient(96deg,var(--cyan),var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.suite{margin-top:12px;font:500 10.5px/1 var(--mono);letter-spacing:.34em;
  text-transform:uppercase;color:var(--mu)}

.tag{margin-top:19px;text-align:center;font:400 clamp(18px,2.4vw,28px)/1.3 var(--serif);
  color:var(--navy)}
.tag b{display:block;font-weight:400;font-style:italic;color:var(--blue)}
.tag::after{content:"";display:block;width:52px;height:3px;margin:15px auto 0;
  border-radius:2px;background:var(--gold)}

/* card */
.card{width:min(394px,100%);margin-top:28px;background:var(--paper);
  border:1px solid var(--edge);border-radius:12px;padding:26px;
  box-shadow:0 20px 54px rgba(38,48,84,.13),0 2px 6px rgba(38,48,84,.06)}
.card h2{font:500 15px/1.3 var(--sans);color:var(--navy)}
.card .sub{margin-top:5px;font-size:13px;color:var(--mu)}
.field{margin-top:17px}
.field label{display:block;font:500 10.5px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--mu);margin-bottom:7px}
.field input{width:100%;background:#FBFDFF;color:var(--navy);border:1px solid var(--edge);
  border-radius:7px;padding:12px 13px;font:400 15px/1.2 var(--sans)}
.field input::placeholder{color:#9AAAC2}
.field input:focus{outline:none;border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(11,157,208,.16)}
.submit{width:100%;margin-top:21px;cursor:pointer;color:#fff;border:none;
  background:linear-gradient(96deg,var(--navy) 0%,var(--blue) 52%,var(--teal) 100%);
  border-radius:7px;padding:14px;font:500 15px/1 var(--sans);letter-spacing:.005em}
.submit:hover{filter:brightness(1.09)}
.submit:active{transform:translateY(1px)}
.msg{margin-top:12px;min-height:18px;text-align:center;font-size:12.5px;color:#A8701A}
.alt{margin-top:13px;text-align:center;font-size:13px;color:var(--mu)}
.alt a{color:var(--teal);text-decoration:none;font-weight:450}
.alt a:hover{text-decoration:underline}
.notice{margin-top:17px;padding-top:15px;border-top:1px solid var(--edge);
  font:400 11px/1.55 var(--mono);color:#7E8DA6;text-align:center}
.notice .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);margin-right:6px;vertical-align:1px}

/* GDFS lockup below */
.parent{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:11px}
.parent .cap{font:500 9.5px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;
  color:#8494AE}
.parent img{height:clamp(30px,4.4vw,42px);display:block}

.gate.on .logo-row,.gate.on .suite,.gate.on .tag,.gate.on .card,.gate.on .parent{
  animation:up .9s ease backwards}
.gate.on .logo-row{animation-delay:.15s}
.gate.on .suite{animation-delay:.8s}
.gate.on .tag{animation-delay:1.05s}
.gate.on .card{animation-delay:1.45s}
.gate.on .parent{animation-delay:1.9s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= hud ================= */
.hud{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
  gap:14px;padding:16px 20px;transition:opacity .8s}
body.done .hud{opacity:0;pointer-events:none}
.btn-min{cursor:pointer;background:rgba(6,14,28,.5);border:1px solid rgba(255,255,255,.4);
  color:#DCE7F5;border-radius:5px;padding:8px 13px;font:500 10.5px/1 var(--mono);
  letter-spacing:.14em;text-transform:uppercase;opacity:.8;backdrop-filter:blur(6px)}
.btn-min:hover{opacity:1}
.spacer{flex:1}
.replay{position:fixed;right:18px;bottom:16px;z-index:31;opacity:0;pointer-events:none;
  transition:opacity .8s;background:#fff;border:1px solid var(--edge);color:var(--mu)}
body.done .replay{opacity:.8;pointer-events:auto}
.replay:hover{opacity:1}

.tap{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(4,9,18,.66)}
.tap.on{display:flex}
.tap span{border:1px solid rgba(190,220,250,.55);border-radius:999px;padding:15px 30px;
  font:500 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#EAF1FA;
  backdrop-filter:blur(8px)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>

<div class="reel">
  <div class="frame">
    <!-- the film carries its own titles; the file has no audio track at all -->
    <video id="film" muted playsinline autoplay preload="auto" disablepictureinpicture>
      <source src="assets/intro.mp4" type="video/mp4">
    </video>
    <button class="snd" id="snd" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <g class="wave"><path d="M16.5 8.5a5 5 0 0 1 0 7l1.4 1.4a7 7 0 0 0 0-9.8l-1.4 1.4z"/></g>
      </svg>
      <span id="sndLabel">Sound on</span>
    </button>
  </div>
  <div class="wash"></div>
</div>

<div class="tap" id="tap"><span>Tap to begin</span></div>

<main class="gate" id="gate">
  <div class="logo-row">
    <svg class="mark" viewBox="0 0 120 120" aria-label="EqDe Capital">
      <defs>
        <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#4E6FB2"/>
          <stop offset="52%"  stop-color="#0B9DD0"/>
          <stop offset="100%" stop-color="#16B774"/>
        </linearGradient>
      </defs>
      <rect class="m-top" x="12" y="38" width="96" height="16" rx="3"/>
      <rect class="m-seg" x="12" y="70" width="14" height="16" rx="3" fill="url(#sw)"/>
      <rect class="m-seg" x="30" y="70" width="14" height="16" rx="3" fill="url(#sw)"/>
      <rect class="m-seg" x="48" y="70" width="14" height="16" rx="3" fill="url(#sw)"/>
      <rect class="m-seg" x="66" y="70" width="14" height="16" rx="3" fill="url(#sw)"/>
      <rect class="m-seg" x="84" y="70" width="24" height="16" rx="3" fill="url(#sw)"/>
    </svg>
    <div class="word">Eq<span class="d">De</span></div>
  </div>
  <p class="suite">Capital</p>
  <p class="tag">We calculate.<b>We don't predict.</b></p>

  <section class="card">
    <h2>Sign in to the alpha engine</h2>
    <p class="sub">Access is limited to EqDe team members.</p>
    <div class="field">
      <label for="email">Work email</label>
      <input id="email" type="email" autocomplete="username" spellcheck="false"
             placeholder="name@eqdecapital.com">
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password"
             placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
    </div>
    <button class="submit" id="go">Sign in</button>
    <p class="msg" id="msg" role="status"></p>
    <p class="alt">Or <a href="#" id="otp">send me a one-time code</a></p>
    <p class="notice"><span class="dot"></span>Every session is recorded against your name.</p>
  </section>

  <div class="parent">
    <span class="cap">A GDFS Group company</span>
    <img src="assets/gdfs-logo.png" alt="GDFS Group — from health to wealth">
  </div>
</main>

<div class="hud">
  <div class="spacer"></div>
  <button class="btn-min" id="skip">Skip intro</button>
</div>
<button class="btn-min replay" id="again">Replay intro</button>

<script>
const film = document.getElementById('film');
const gate = document.getElementById('gate');
const tap  = document.getElementById('tap');
const snd  = document.getElementById('snd');
const sndLabel = document.getElementById('sndLabel');

/* Audio cannot autoplay - the film starts muted and the visitor opts in.
   Restarting from the top is what makes the score line up with the cuts. */
snd.addEventListener('click', () => {
  film.muted = !film.muted;
  snd.classList.toggle('live', !film.muted);
  snd.setAttribute('aria-pressed', String(!film.muted));
  sndLabel.textContent = film.muted ? 'Sound on' : 'Sound off';
  if(!film.muted && film.currentTime > 1.5){
    film.currentTime = 0;
  }
  film.play();
});

function openGate(){
  film.pause();
  document.body.classList.add('done');
  gate.classList.add('on');
}
film.addEventListener('ended', openGate);
document.getElementById('skip').addEventListener('click', () => {
  film.currentTime = film.duration || 36; openGate();
});
document.getElementById('again').addEventListener('click', () => {
  document.body.classList.remove('done');
  gate.classList.remove('on');
  film.currentTime = 0; film.play();
});

/* muted + playsinline normally permits autoplay; offer a tap if it does not */
film.play().catch(() => tap.classList.add('on'));
tap.addEventListener('click', () => { tap.classList.remove('on'); film.play(); });

/* ------------------------------------------------------------------
   STUB ONLY - THIS DOES NOT AUTHENTICATE ANYONE.
   A static page cannot verify a credential; anything checked in JS is
   readable by the visitor. Real enforcement goes in front of this page
   (Cloudflare Access) or behind it (POST to the Python backend).
------------------------------------------------------------------- */
const msg = document.getElementById('msg');
function signIn(){
  const email = document.getElementById('email').value.trim();
  const pw    = document.getElementById('pw').value;
  if(!email || !pw){ msg.textContent = 'Enter your work email and password.'; return; }
  msg.textContent = 'Sign-in is not connected yet. The backend is not built.';
  /* Phase 3:
     const r = await fetch('/api/session', {method:'POST',
       headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, pw})});
     if (r.ok) location.href = '/app/'; else msg.textContent = 'Those details do not match.';
  */
}
document.getElementById('go').addEventListener('click', signIn);
document.getElementById('pw').addEventListener('keydown', e => {
  if(e.key === 'Enter') signIn();
});
document.getElementById('otp').addEventListener('click', e => {
  e.preventDefault();
  msg.textContent = 'One-time codes arrive with Cloudflare Access in phase 3.';
});
</script>
</body>
</html>
