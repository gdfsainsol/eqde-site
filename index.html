<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EqDe Capital</title>
<meta name="robots" content="noindex,nofollow">

<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#050506">

<meta property="og:type" content="website">
<meta property="og:site_name" content="EqDe Capital">
<meta property="og:title" content="EqDe Capital">
<meta property="og:description" content="A GDFS Group company.">
<meta property="og:url" content="https://eqdecapital.com/">
<meta property="og:image" content="https://eqdecapital.com/assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">

<style>
:root{
  /* every value below is taken from the mark itself */
  --ink:#050506;          /* the mark's own ground */
  --gold-d:#8F6B1E;
  --gold:#C9A227;
  --gold-l:#E7CC79;
  --silver:#C6CBD1;
  --paper:#F3F4F6;
  --mu:#7E838C;
  --line:rgba(255,255,255,.09);
  --field:rgba(255,255,255,.035);
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:40px 22px;
  position:relative;overflow-x:hidden;
}
/* a single cold light above the mark, nothing more */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 62% at 50% 6%,rgba(201,162,39,.10) 0%,transparent 58%);
}

.stage{width:100%;max-width:372px;position:relative;z-index:1}

/* ---------- the mark ---------- */
.mark{
  display:block;width:100%;max-width:300px;margin:0 auto 34px;
  /* the file carries a black ground; screen drops it onto the page ground */
  mix-blend-mode:screen;
  animation:markIn 3.1s cubic-bezier(.22,.61,.36,1) both;
  will-change:transform,opacity;
}
/* enters large and centred, holds, then settles to its resting size on top */
@keyframes markIn{
  0%   {opacity:0;transform:translateY(var(--drop,86px)) scale(1.30);filter:blur(7px)}
  20%  {opacity:1;transform:translateY(var(--drop,86px)) scale(1.27);filter:blur(0)}
  52%  {opacity:1;transform:translateY(var(--drop,86px)) scale(1.27);filter:blur(0)}
  100% {opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

.rule{
  height:1px;margin:0 auto 30px;max-width:300px;
  background:linear-gradient(90deg,transparent,var(--gold-d) 22%,var(--gold) 50%,var(--gold-d) 78%,transparent);
  opacity:.55;transform:scaleX(0);transform-origin:50% 50%;
  animation:ruleIn .9s cubic-bezier(.22,.61,.36,1) 2.35s both;
}
@keyframes ruleIn{to{transform:scaleX(1)}}

/* ---------- sign in ---------- */
.panel{animation:panelIn .95s cubic-bezier(.22,.61,.36,1) 2.5s both}
@keyframes panelIn{
  from{opacity:0;transform:translateY(16px)}
  to  {opacity:1;transform:none}
}

.eyebrow{
  font:500 9.5px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;
  color:var(--mu);text-align:center;margin-bottom:26px;
}

.field{margin-bottom:16px}
.field label{
  display:block;margin-bottom:8px;
  font:500 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--mu);
}
.field input{
  width:100%;padding:13px 15px;
  background:var(--field);color:var(--paper);
  border:1px solid var(--line);border-radius:9px;
  font:400 15px/1.2 var(--sans);
  transition:border-color .18s ease,background .18s ease;
}
.field input::placeholder{color:#4E525A}
.field input:hover{border-color:rgba(255,255,255,.16)}
.field input:focus{
  outline:none;background:rgba(255,255,255,.05);
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,39,.13);
}

.submit{
  width:100%;margin-top:10px;padding:14px 18px;cursor:pointer;
  border:none;border-radius:9px;
  background:linear-gradient(100deg,var(--gold-d) 0%,var(--gold) 34%,var(--gold-l) 52%,var(--gold) 68%,var(--gold-d) 100%);
  color:#1A1403;
  font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
  transition:filter .18s ease,transform .06s ease;
}
.submit:hover{filter:brightness(1.1)}
.submit:active{transform:translateY(1px)}
.submit:disabled{opacity:.55;cursor:default;filter:none}

.msg{
  min-height:19px;margin-top:14px;text-align:center;
  font:400 12.5px/1.5 var(--sans);color:var(--mu);
}
.msg.bad{color:#E0A0A0}

.foot{
  margin-top:38px;text-align:center;
  font:500 9px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;
  color:#5A5E66;
}

/* keyboard users must always see where they are */
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@media (max-width:400px){
  .mark{max-width:246px;margin-bottom:28px}
  .rule{max-width:246px}
}
@media (prefers-reduced-motion:reduce){
  .mark,.rule,.panel{animation:none;opacity:1;transform:none}
}
</style>
</head>

<body>
  <main class="stage">
    <img class="mark" src="assets/eqde-mark.jpg" alt="EqDe Capital">
    <div class="rule" aria-hidden="true"></div>

    <section class="panel">
      <p class="eyebrow">Alpha engine</p>

      <div class="field">
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="username" spellcheck="false"
               placeholder="name@eqdecapital.com">
      </div>

      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password"
               placeholder="••••••••••">
      </div>

      <button class="submit" id="go">Sign in</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <p class="foot">A GDFS Group company</p>
    </section>
  </main>

<script>
/* ------------------------------------------------------------------
   This form does not authenticate anyone on its own, and it cannot:
   a static page has no secret to check against, and anything checked
   in JavaScript is readable by the visitor. The real gate is
   Cloudflare Access, which sits in FRONT of this page.

   The POST below is live, so the moment /api/session exists on the
   backend this page starts working with no further change. Until
   then it says so plainly rather than pretending to sign anyone in.
------------------------------------------------------------------- */
const $   = id => document.getElementById(id);
const msg = $('msg');
const go  = $('go');

function say(text, bad){
  msg.textContent = text;
  msg.classList.toggle('bad', !!bad);
}

async function signIn(){
  const email = $('email').value.trim();
  const pw    = $('pw').value;

  if(!email || !pw){ say('Enter your work email and password.', true); return; }

  go.disabled = true;
  say('Checking\u2026');

  try{
    const r = await fetch('/api/session', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, pw})
    });

    if(r.ok){ location.href = '/app/'; return; }

    if(r.status === 404){
      say('Sign-in is not connected yet. Access controls the door for now.');
    }else if(r.status === 401 || r.status === 403){
      say('Those details do not match.', true);
    }else{
      say('The server refused the request (' + r.status + '). Try again.', true);
    }
  }catch(e){
    say('Cannot reach the server. Check it is running, then try again.', true);
  }finally{
    go.disabled = false;
  }
}

go.addEventListener('click', signIn);
['email','pw'].forEach(id =>
  $(id).addEventListener('keydown', e => { if(e.key === 'Enter') signIn(); }));

/* the mark drops by half the panel's height so it reads as centred while it
   holds, then rises to its resting place. Measured, not guessed, so it lands
   correctly on any screen. */
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const panel = document.querySelector('.panel');
  const drop  = Math.min(Math.round(panel.offsetHeight / 2), 150);
  document.querySelector('.mark').style.setProperty('--drop', drop + 'px');
})();
</script>
</body>
</html>
