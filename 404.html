<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found — EqDe Capital</title>
<meta name="robots" content="noindex,nofollow">

<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#050506">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#050506;
  --gold-d:#8F6B1E;
  --gold:#C9A227;
  --gold-l:#E7CC79;
  --paper:#F3F4F6;
  --mu:#7E838C;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--paper);
  font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:40px 22px;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 62% at 50% 6%,rgba(201,162,39,.10) 0%,transparent 58%);
}
.stage{width:100%;max-width:400px;position:relative;z-index:1}

.mark{
  display:block;width:100%;max-width:224px;margin:0 auto 30px;
  mix-blend-mode:screen;
  animation:in .8s cubic-bezier(.22,.61,.36,1) both;
}
.code{
  font:500 9.5px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;
  color:var(--gold);animation:in .8s cubic-bezier(.22,.61,.36,1) .1s both;
}
h1{
  margin-top:16px;font:450 25px/1.3 var(--sans);letter-spacing:-.01em;
  animation:in .8s cubic-bezier(.22,.61,.36,1) .18s both;
}
p.note{
  margin-top:12px;color:var(--mu);font-size:14.5px;
  animation:in .8s cubic-bezier(.22,.61,.36,1) .26s both;
}
a.home{
  display:inline-block;margin-top:30px;text-decoration:none;
  padding:13px 30px;border-radius:9px;color:#1A1403;
  background:linear-gradient(100deg,var(--gold-d) 0%,var(--gold) 34%,var(--gold-l) 52%,var(--gold) 68%,var(--gold-d) 100%);
  font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
  transition:filter .18s ease;
  animation:in .8s cubic-bezier(.22,.61,.36,1) .34s both;
}
a.home:hover{filter:brightness(1.1)}
.parent{
  margin-top:44px;animation:in .8s cubic-bezier(.22,.61,.36,1) .42s both;
}
.parent img{height:26px;opacity:.5}

@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .mark,.code,h1,p.note,a.home,.parent{animation:none}
}
</style>
</head>
<body>
  <main class="stage">
    <img class="mark" src="assets/eqde-mark.jpg" alt="EqDe Capital">
    <p class="code">Error 404</p>
    <h1>That page isn't here.</h1>
    <p class="note">The link may be out of date, or the page may have moved. The front door still works.</p>
    <a class="home" href="/">Back to sign in</a>
    <div class="parent">
      <img src="assets/gdfs-logo-white.png" alt="GDFS Group">
    </div>
  </main>
</body>
</html>
